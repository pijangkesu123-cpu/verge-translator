
name: Build Verge Translator EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "verge_translator.py"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name VergeTranslator verge_translator.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VergeTranslator-Windows-x64
          path: dist/VergeTranslator.exe
